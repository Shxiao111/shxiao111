name: profile cards

on:
  schedule:
    - cron: "17 0 * * *"   # daily, 00:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cards.yml"
      - "scripts/gen_cards.py"
      - "scripts/common.py"
      - "scripts/art/**"
      - "scripts/fonts.json"
      - "scripts/maple.py"
      - "scripts/winter.py"
      - "scripts/spring.py"
      - "scripts/summer.py"
      - "scripts/paper.py"
      - "scripts/sunlight.py"

permissions:
  contents: write

# the schedule and a push can overlap; both force-push the same branches, so let one finish first
concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `live` wears the calendar's season and goes to the output branch the profile reads; each of the others is
    # one season worn whatever the date, published whole to its own preview-<season> branch
    strategy:
      fail-fast: false   # a preview that fails must not cancel the live cards
      matrix:
        season: [live, autumn, winter, spring, summer]
    env:
      SEASON: ${{ matrix.season != 'live' && matrix.season || '' }}   # empty: common.py asks the calendar
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # first, so gen_cards.py can frame it as the contributions card; dots in maple colours, ember to vermilion
      # (autumn's: gen_cards.py swaps in the colours of whichever season common.py has in wear)
      - name: generate contribution snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#b99cff&color_dots=#2a221a,#5c2a16,#9c3a18,#e0552a,#ff9660
            dist/snake-light.svg?palette=github-light&color_snake=#7c5cbf&color_dots=#f1e7d3,#f8c89a,#f08a4b,#d9481c,#a82a10

      - name: generate stats, bookshelf, contents and contributions cards
        run: python scripts/gen_cards.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}

      # the hero, chapter and footer pages, in this leg's season
      - name: draw the static pages
        run: |
          python -m pip install -q -r scripts/requirements.txt
          python scripts/gen_hero.py

      # a whole profile in one season - the README and the pages just drawn beside the cards, the card urls made
      # relative - for its preview-<season> branch, where GitHub renders it as it will the profile
      - name: assemble preview
        if: matrix.season != 'live'
        run: |
          sed -E 's#https://raw\.githubusercontent\.com/[^/"]+/[^/"]+/output/##g' README.md > dist/README.md
          cp -r assets dist/assets
          printf '\n<sub>%s preview of <code>%s</code> at %s</sub>\n' "$SEASON" "$GITHUB_REF_NAME" "${GITHUB_SHA::7}" >> dist/README.md

      # off main nothing may touch the live cards: a run there (workflow_dispatch on a branch) only redraws the
      # four previews, from that branch
      - name: publish to the output branch, or a season's preview to its own
        if: matrix.season != 'live' || github.ref_name == 'main'
        uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865 # v4.2.0
        with:
          target_branch: ${{ matrix.season == 'live' && 'output' || format('preview-{0}', matrix.season) }}
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # the season follows the calendar (common.py) and the static pages are committed: when it turns, commit
      # the redrawn ones, so the profile changes with the cards and check.yml's comparison stays true
      - name: commit the static pages when the season turns
        if: matrix.season == 'live' && github.ref_name == 'main'
        run: |
          git diff --quiet -- assets/ && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: the season turns" -- assets/
          git push origin HEAD:main
