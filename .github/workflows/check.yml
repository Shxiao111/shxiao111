name: check profile assets

on:
  pull_request:
    paths:
      - "scripts/**"
      - "assets/**"
      - ".github/workflows/check.yml"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "assets/**"
      - ".github/workflows/check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: install font dependencies
        run: python -m pip install -r scripts/requirements.txt
      - name: test streaks and render every card
        run: python -m unittest discover -s scripts -p "test_*.py"
      - name: rebuild static assets
        run: python scripts/gen_hero.py
      # when the season has just turned, cards.yml's daily run may not have redrawn them yet (its schedule can
      # start hours late): until it has, last season's pages are the current ones
      - name: check committed assets are current
        run: |
          git diff --quiet -- assets/ && exit 0
          SEASON=$(python -c "import sys, datetime as dt; sys.path.insert(0, 'scripts'); from common import season_of; print(season_of((dt.datetime.now(dt.timezone.utc).month - 2) % 12 + 1))") python scripts/gen_hero.py
          git diff --exit-code -- assets/
